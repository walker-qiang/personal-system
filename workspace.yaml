schema_version: 1
# 双机实际路径不同：/Users/liqiang/code/personal-system 与 /Users/qiang.lilq/personal-system
root: /Users/qiang.lilq/personal-system
policy:
  top_level_git_role: workspace-governance
  submodule_policy: do_not_use_by_default
  docs_language: zh-CN
  runtime_state_tracked: false
projects:
  - name: personal-system
    path: .
    git: top-level
    status: usable
    completion: usable
    long_term: true
    role: workspace governance repo for docs, rules, progress, migration records, and project registry
    next: 维护分机器的项目进度、问题台账和验证证据；remote 已配置
  - name: personal-assets
    path: personal-assets
    git: independent
    status: active
    completion: stable
    long_term: true
    role: durable source of truth for finance facts and broader personal assets
    primary_entry: Obsidian for broader knowledge; personal-os API for controlled finance, investment, memory, and skill writes
    next: keep personal-assets as the only active asset directory; continue day-to-day knowledge refinement and historical doc cleanup
  - name: personal-os
    path: personal-os
    git: independent
    status: active
    completion: usable
    long_term: true
    role: finance and investment operating app and product/API entrypoint for the independent Agent
    scope: finance snapshots, manual-first stock/fund V3 research, watchlists, fund pool, cache/status checks, Agent HTTP/SSE proxy
    next: 按授权范围、资料权限和预算完成真实 V3 连续复查；正常使用由 App 托管 API/Agent 生命周期
  - name: personal-agent
    path: personal-agent
    git: independent
    status: active
    completion: usable
    long_term: true
    role: independent Python Agent Runtime and chat/tool service; personal-os consumes it over HTTP/SSE
    scope: model/tool loop, Runtime operations, approvals, sessions, traces, and Agent application workflows
    next: 验证引用修复在真实 V3 复查中的效果与成本；所有 durable write 继续经过 personal-os
  - name: personal-tools
    path: personal-tools
    git: independent
    status: active
    completion: active
    long_term: true
    current_path: /Users/qiang.lilq/personal-system/personal-tools  # 双机路径不同，另一台为 /Users/liqiang/code/personal-system/personal-tools
    role: reusable personal tool repo; current inventory is the weixin-clip Chrome extension and workspace-git-delivery Codex skill
    next: 统一 weixin-clip 真实页面验收记录并按需补本机验收；保持全局 Codex skill 符号链接指向源码
migration_sources:
  - name: obsidian-wiki
    current_path: not_found_in_current_workspace_snapshot (historical obsidian-wiki references remain in docs and migrated facts)
    status: reference-only
    final_state: migration_complete_reference_only
    migrated_into: personal-assets
  - name: personal-finance
    current_path: archived (historical path was /Users/liqiang/code/personal-finance)
    status: archived
    final_state: archived
    migrated_into: personal-os and personal-assets
  - name: personal-web
    current_path: archived (historical path was /Users/liqiang/code/personal-web)
    status: archived
    final_state: archived
    migrated_into: personal-os macOS App
top_level_tracked_areas:
  - .gitignore
  - .obsidian
  - .workbuddy
  - docs
  - e2e-test-report
  - package.json
  - package-lock.json
  - README.md
  - AGENTS.md
  - workspace.yaml
